services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    restart: unless-stopped
    depends_on:
      - poll-service
      - vote-service
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-server:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka-server:
        condition: service_healthy
    restart: always
  kafka-server:
    image: apache/kafka:4.3.0
    container_name: kafka-server
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-server:9093

      # Define separate listeners for Internal (Docker) and External (Host)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-server:9092,EXTERNAL://localhost:29092

      # Map listener protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # single broker dev mode
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'nc -z localhost 9092'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
  polls-maker-cache:
    image: redis:8.0-alpine
    container_name: polls-maker-cache
    environment:
      REDIS_PASSWORD: password
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    volumes:
      - redisdata:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    restart: always
    depends_on:
      polls-maker-cache:
        condition: service_healthy
  polls-maker-db:
    image: postgres:16-alpine
    container_name: polls-maker-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: polls_maker
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polls_maker"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  poll-service-migrations:
    build:
      context: ./services/poll_service
      dockerfile: Dockerfile
    env_file:
      - ./services/poll_service/.env
    depends_on:
      polls-maker-db:
        condition: service_healthy
    command: node dist/src/migrate.js
  poll-service:
    build:
      context: ./services/poll_service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "50051:50051"
    env_file:
      - ./services/poll_service/.env
    depends_on:
      polls-maker-db:
        condition: service_healthy
      poll-service-migrations:
        condition: service_completed_successfully
      kafka-server:
        condition: service_healthy
    restart: always
  vote-service-migrations:
    build:
      context: ./services/vote_service
      dockerfile: Dockerfile
    env_file:
      - ./services/vote_service/.env
    depends_on:
      polls-maker-db:
        condition: service_healthy
      poll-service-migrations:
        condition: service_completed_successfully
    entrypoint: ["/go/bin/migration/migrate"]
  vote-service:
    build:
      context: ./services/vote_service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./services/vote_service/.env
    depends_on:
      polls-maker-db:
        condition: service_healthy
      vote-service-migrations:
        condition: service_completed_successfully
      polls-maker-cache:
        condition: service_healthy
      kafka-server:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
  redisdata:
  kafka-data:
