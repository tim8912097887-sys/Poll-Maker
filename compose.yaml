services:
  polls-maker-cache:
    image: redis:8.0-alpine
    container_name: polls-maker-cache
    environment:
      - REDIS_PASSWORD=password
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    volumes:
      - redisdata:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    restart: always
    depends_on:
      polls-maker-cache:
        condition: service_healthy
  polls-maker-db:
    image: postgres:16-alpine
    container_name: polls-maker-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: polls_maker
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polls_maker"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  poll-service-migrations:
    build:
      context: ./services/poll_service
      dockerfile: Dockerfile
    env_file:
      - ./services/poll_service/.env
    depends_on:
      polls-maker-db:
        condition: service_healthy
    command: node dist/src/migrate.js
  poll-service:
    build:
      context: ./services/poll_service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./services/poll_service/.env
    depends_on:
      polls-maker-db:
        condition: service_healthy
      poll-service-migrations:
        condition: service_completed_successfully
  vote-service-migrations:
    build:
      context: ./services/vote_service
      dockerfile: Dockerfile
    env_file:
      - ./services/vote_service/.env
    depends_on:
      polls-maker-db:
        condition: service_healthy
      poll-service-migrations:
        condition: service_completed_successfully
    entrypoint: ["/go/bin/migration/migrate"]
  vote-service:
    build:
      context: ./services/vote_service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./services/vote_service/.env
    depends_on:
      polls-maker-db:
        condition: service_healthy
      vote-service-migrations:
        condition: service_completed_successfully
      polls-maker-cache:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
