name: CI-Polls-Service-Build-and-Lint
on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
    paths:
      - "services/poll_service/**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
jobs:
  polls-service-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/poll_service
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: ./.github/actions/node-setup/action.yaml
        with:
          node-version: ${{ matrix.node-version }}
          pnpm-version: 10.26.1
          workdir: ./services/poll_service
      - name: Build
        run: pnpm build
  polls-service-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/poll_service
    steps:
      - uses: ./.github/actions/node-setup/action.yaml
        with:
          node-version: 24
          pnpm-version: 10.26.1
          workdir: ./services/poll_service
      - name: Run lint
        run: pnpm lint
