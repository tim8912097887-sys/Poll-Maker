name: CI-Polls-Service-Build-and-Lint
on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
    paths:
      - "services/poll_service/**"
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
jobs:
  polls-service-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/poll_service
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.26.1
          standalone: true
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: "./services/poll_service/pnpm-lock.yaml"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run build
        run: pnpm build
  polls-service-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/poll_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.26.1
          standalone: true
      - name: Set up Node.js 24
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "./services/poll_service/pnpm-lock.yaml"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint
