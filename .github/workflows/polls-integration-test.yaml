name: CI-Polls-Service-Integration-Test
on:
  pull_request:
    branches:
      - main
      - feat/**
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
jobs:
  polls-service-integration-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/poll_service
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node and PNPM
        uses: ./.github/actions/node-setup
        with:
          node-version: ${{ matrix.node-version }}
          pnpm-version: 10.26.1
          workdir: ./services/poll_service
      - name: Test
        run: pnpm test
