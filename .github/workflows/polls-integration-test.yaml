name: CI-Polls-Service-Integration-Test
on:
  pull_request:
    branches:
      - main
      - feat/**
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
jobs:
  polls-service-integration-test:
    environment:
      name: Poll Service
    runs-on: ubuntu-latest
    env:
      NODE_ENV: $ {{ vars.NODE_ENV }}
      PORT: $ {{ vars.PORT }}
      CACHE_SOCKET_TIMEOUT: $ {{ vars.CACHE_SOCKET_TIMEOUT }}
      LOG_LEVEL: $ {{ vars.LOG_LEVEL }}
      DATABASE_URL: $ {{ secrets.DATABASE_URL }}
      CACHE_URL: $ {{ secrets.CACHE_URL }}
    defaults:
      run:
        working-directory: ./services/poll_service
    strategy:
      matrix:
        node-version: [22, 24]
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: $ {{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: polls_maker
        options: >-
          --health-cmd "pg_isready -U postgres -d polls_maker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -a $ {{ secrets.REDIS_PASSWORD }} ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s
        command: >
          redis-server --requirepass $ {{ secrets.REDIS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node and PNPM
        uses: ./.github/actions/node-setup
        with:
          node-version: ${{ matrix.node-version }}
          pnpm-version: 10.26.1
          workdir: ./services/poll_service
      - name: Test
        run: pnpm test
