api:
  dashboard: true
  insecure: false
entrypoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
logs:
  level: DEBUG
providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
accessLog: {}
